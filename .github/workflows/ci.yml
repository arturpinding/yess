name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test, build, and exercise
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rada
          POSTGRES_USER: rada
          POSTGRES_PASSWORD: rada_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rada -d rada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://rada:rada_ci_only@127.0.0.1:5432/rada
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      MEDIA_SIGNING_SECRET: ci-media-secret-distinct-and-at-least-thirty-two
      APP_ORIGIN: http://localhost:3000
      DEFAULT_COUNTRY: EE
      LOG_LEVEL: silent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests with coverage thresholds
        run: npm run test:coverage

      - name: Apply migrations and seed demo data
        run: npm run db:setup

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile and desktop end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
