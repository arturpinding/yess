services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rada
      POSTGRES_USER: rada
      POSTGRES_PASSWORD: rada_dev_only
    ports:
      - "5432:5432"
    volumes:
      - rada_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rada -d rada"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rada_postgres:
